services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NUXT_SMTP_HOST: ${NUXT_SMTP_HOST:-ssl0.ovh.net}
      NUXT_SMTP_PORT: ${NUXT_SMTP_PORT:-465}
      NUXT_SMTP_USER: ${NUXT_SMTP_USER:?Set NUXT_SMTP_USER in .env}
      NUXT_SMTP_PASSWORD: ${NUXT_SMTP_PASSWORD:?Set NUXT_SMTP_PASSWORD in .env}
      NUXT_CONTACT_TO: ${NUXT_CONTACT_TO:-contact@ethanbaumann.fr}
      NUXT_CONTACT_ORIGIN: ${NUXT_CONTACT_ORIGIN:-https://ethanbaumann.fr}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
